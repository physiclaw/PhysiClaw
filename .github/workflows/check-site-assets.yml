# CI completion waits for Linux, macOS, and Windows.
# Skip commits that also run non-test workflows.
name: Check site assets

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: check-site-assets
  cancel-in-progress: false

jobs:
  check:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for non-test workflows and deployments
        id: idle
        uses: actions/github-script@v9
        with:
          script: |
            const skip = reason => {
              core.notice(`Asset audit skipped: ${reason}`);
              return false;
            };
            const {data: main} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (main.commit.sha !== context.payload.workflow_run.head_sha) {
              return skip('this CI run has been superseded by a newer main commit.');
            }
            const isOtherWorkflow = run =>
              run.name !== context.workflow && run.path !== '.github/workflows/ci.yml';
            const related = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo, head_sha: context.payload.workflow_run.head_sha, per_page: 100,
            });
            const other = related.find(isOtherWorkflow);
            if (other) return skip(`${other.name} also ran for this commit.`);
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...context.repo, status, per_page: 100,
              });
              const busy = runs.find(isOtherWorkflow);
              if (busy) return skip(`${busy.name} is ${status}.`);
            }
            for (const repo of ['PhysiClaw-site', 'docs-site']) {
              const checks = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner, repo, ref: 'main', per_page: 100,
              });
              const busy = checks.find(check =>
                check.app?.slug === 'cloudflare-workers-and-pages' && check.status !== 'completed'
              );
              if (busy) return skip(`${repo} is deploying.`);
            }
            return true;

      - uses: actions/checkout@v5
        if: steps.idle.outputs.result == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        if: steps.idle.outputs.result == 'true'
        with:
          python-version: '3.12'

      - name: Compare live assets with GitHub
        id: audit
        if: steps.idle.outputs.result == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site-asset-report
          python -u scripts/check_site_assets.py --report site-asset-report/assets.csv 2>&1 | tee site-asset-report/check.log

      - name: Save report and log
        if: always() && steps.audit.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: site-asset-report
          path: site-asset-report/
          retention-days: 14
