# Lint + test on every push / PR. Runs the full hermetic suite with branch
# coverage (fail_under gates in pyproject; @integration is reserved for
# tests needing a real port/camera) on Linux and macOS, so the platform
# backends — including the Linux one — are exercised on a real host of each
# OS. Windows isn't run here yet (no hosted rig); install.ps1 + the windows
# backend are validated manually.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # OpenCV's manylinux wheel links libGL + glib; install them so `import
      # cv2` works headless (mirrors install.sh's Linux guidance).
      - name: Install OpenCV system libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      # Pinned by SHA: setup-uv stopped publishing major tags in v8.
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        # CAD orchestration tests must run, not silently importorskip.
        run: uv sync --locked --group dev --group cad

      # Inline JavaScript uses Node's built-in test runner; no npm
      # packages or Node runtime are needed by the Python application.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: JavaScript UI regressions
        run: make test-studio-ui

      # Mirrors `make lint`: ruff check on the packaged code, format check
      # everywhere (hardware/ is style-star-import CAD code, format-only).
      - name: Lint
        run: |
          uv run ruff check src/ tests/ hardware/release.py hardware/build_lock.py hardware/assembly/cache.py hardware/assembly/build_procedures.py
          uv run ruff format --check src/ tests/ hardware/ scripts/

      # Mirrors `make typecheck`: scope + settings from [tool.mypy] in
      # pyproject (src/physiclaw only; tests and hardware/ aren't gated yet).
      - name: Type check
        run: uv run mypy

      # Static cross-artifact consistency for the CAD pipeline (procedure
      # stems / patches / manual figures / sourcing ids) — stdlib-only, no
      # cad dependency group needed.
      - name: Hardware consistency check
        run: uv run --locked python -m hardware check

      - name: Hardware CAD smoke build
        env:
          PHYSICLAW_HW_OUTPUT: ${{ runner.temp }}/hardware-smoke
        run: uv run --locked --group cad python -m hardware step fastener_10_BHCS

      # Bare --cov: source + branch come from [tool.coverage.run] in
      # pyproject, keeping one source of truth.
      - name: Test
        run: uv run --locked --group cad pytest --cov
