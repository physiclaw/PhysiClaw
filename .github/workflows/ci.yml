# Lint + fast hermetic tests with branch coverage on Linux and macOS.
# Slow managed first-image/EOF and bridge shutdown regressions run on all three OSes.
# Windows also runs runtime, camera/focus, bridge shutdown and observation
# regressions. Installation and real hardware need manual validation.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # OpenCV's manylinux wheel links libGL + glib; install them so `import
      # cv2` works headless (mirrors install.sh's Linux guidance).
      - name: Install OpenCV system libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      # Pinned by SHA: setup-uv stopped publishing major tags in v8.
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        # CAD orchestration tests must run, not silently importorskip.
        run: uv sync --locked --group dev --group cad

      # Inline JavaScript uses Node's built-in test runner; no npm
      # packages or Node runtime are needed by the Python application.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: JavaScript UI regressions
        run: make test-studio-ui

      # Mirrors `make lint`: ruff check on the packaged code, format check
      # everywhere (hardware/ is style-star-import CAD code, format-only).
      - name: Lint
        run: |
          uv run ruff check src/ tests/ firmware/ hardware/release.py hardware/build_lock.py hardware/assembly/cache.py hardware/assembly/build_procedures.py
          uv run ruff format --check src/ tests/ hardware/ firmware/ scripts/

      # Mirrors `make typecheck`: scope + settings from [tool.mypy] in
      # pyproject (src/physiclaw only; tests and hardware/ aren't gated yet).
      - name: Type check
        run: uv run mypy

      # Static cross-artifact consistency for the CAD pipeline (procedure
      # stems / patches / manual figures / sourcing ids) — stdlib-only, no
      # cad dependency group needed.
      - name: Hardware consistency check
        run: uv run --locked python -m hardware check

      - name: Hardware CAD smoke build
        env:
          PHYSICLAW_HW_OUTPUT: ${{ runner.temp }}/hardware-smoke
        run: uv run --locked --group cad python -m hardware step fastener_10_BHCS

      # Bare --cov: source + branch come from [tool.coverage.run] in
      # pyproject, keeping one source of truth.
      - name: Test
        run: uv run --locked --group cad pytest --cov

      - name: Managed first image and shutdown regressions
        # The main suite excludes slow tests; exercise subprocess and bridge cleanup too.
        run: >-
          uv run --locked pytest -m slow
          tests/agent/runtime/test_managed_startup.py
          tests/cli/test_bridge_shutdown.py

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Runtime and Windows backend regressions
        # Include the slow fresh-process test: pytest's default excludes it.
        # Only POSIX cross-backend API parity skips here; native dispatch runs.
        run: >-
          uv run --locked pytest -m "not integration"
          tests/agent/runtime
          tests/common/platform/test_windows.py
          tests/common/platform/test_platform_init.py

      - name: Camera focus and bridge shutdown regressions
        # Keep slow TCP-reset, request-drain and lifespan tests enabled.
        # Camera tests fake hardware; only Linux-control variants skip on Windows.
        run: >-
          uv run --locked pytest -m "not integration"
          tests/cli/test_server.py
          tests/cli/test_bridge_shutdown.py
          tests/core/calibration/test_camera_map.py
          tests/core/hardware/test_camera.py
          tests/core/hardware/test_focus.py

      - name: Camera observation and warning regressions
        run: >-
          uv run --locked pytest -m "not integration"
          tests/core/orchestration/test_observation.py
          tests/core/orchestration/test_orchestrator.py
          tests/core/server/test_tools.py
          tests/contract/test_screen_observation.py
          tests/agent/engine/test_fact_input.py
