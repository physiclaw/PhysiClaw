# Shared lint, UI tests and Python tests on all three OSes.
# Fast, slow and integration suites record branch and subprocess coverage.
# Fresh CLI and Make bootstrap run without manual dependency sync on all three OSes.
# Platform-specific tests declare their requirements with pytest skips.
# Package jobs check fresh installs and upgrades, doctor and server interrupts.
# Real hardware needs manual validation.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-id:
        description: Tested Python release artifacts
        value: ${{ jobs.package.outputs.artifact-id }}
      version:
        description: Tested package version
        value: ${{ jobs.package.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - &checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color

  package:
    uses: ./.github/workflows/package.yml

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 30 }}
    env:
      PYTHONUTF8: "1"
    steps:
      - *checkout

      # OpenCV's manylinux wheel links libGL + glib; install them so `import
      # cv2` works headless (mirrors install.sh's Linux guidance).
      - name: Install OpenCV system libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      # Pinned by SHA: setup-uv stopped publishing major tags in v8.
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --yes --no-progress
          }

      # Keep each native command in its own step: PowerShell reports the last
      # command's exit code. pytest's basetemp also needs an existing parent.
      - name: Prepare test reports
        run: uv run --no-project python -c "from pathlib import Path; Path('.test-results').mkdir(exist_ok=True)"

      # Start with no project venv and no manual sync, as a fresh clone would.
      # The Make target must install both dev and CAD dependencies itself.
      - name: Bootstrap test environment through Make
        id: bootstrap
        run: make test-bootstrap

      # Explicit readiness guards let independent checks finish after a failure.
      # A failing check still fails the job; setup failures stop dependent checks.
      - name: Fresh CLI startup without CAD
        if: &test_ready ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/physiclaw-cli-smoke
          PYTEST_ADDOPTS: --junitxml=.test-results/fresh-cli.xml --basetemp=.test-results/tmp-fresh-cli --durations=25
        run: uv run --locked pytest -m slow tests/cli/test_fresh_start.py

      - name: Test with coverage
        timeout-minutes: 30
        if: *test_ready
        # Keep native-encoding coverage, especially Windows' legacy code page.
        env:
          PYTHONUTF8: "0"
          COVERAGE_FILE: .test-results/.coverage.fast
          PYTEST_ADDOPTS: --junitxml=.test-results/fast.xml --basetemp=.test-results/tmp-fast --durations=25
        run: make test-cov

      # Inline JavaScript uses Node's built-in test runner; no npm
      # packages or Node runtime are needed by the Python application.
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && matrix.python == '3.12' }}
        with:
          node-version: "22"
          package-manager-cache: false

      - name: JavaScript UI regressions
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: make test-studio-ui

      - name: Lint
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && matrix.python == '3.12' }}
        run: make lint

      # Mirrors `make typecheck`: scope + settings from [tool.mypy] in
      # pyproject (application and hardware/port; CAD workflows are not gated yet).
      # Mypy defaults to the runner's native sys.platform, including win32.
      - name: Type check
        if: *test_ready
        run: uv run --locked mypy

      # Static cross-artifact consistency for the CAD pipeline (procedure
      # stems / annotations / manual figures / sourcing ids) — stdlib-only, no
      # cad dependency group needed.
      - name: Hardware consistency check
        if: *test_ready
        env:
          PHYSICLAW_HW_OUTPUT: ${{ runner.temp }}/hardware-smoke
        run: uv run --locked python -m hardware check

      - name: Hardware CAD smoke build
        if: *test_ready
        env:
          PHYSICLAW_HW_OUTPUT: ${{ runner.temp }}/hardware-smoke
        run: make hw-build ARGS="--stems fastener_10_BHCS --bom"

      - name: Encoding regressions with UTF-8 disabled
        if: *test_ready
        env:
          PYTEST_ADDOPTS: --junitxml=.test-results/encoding-0.xml --basetemp=.test-results/tmp-encoding-0 --durations=25
        run: make test-encoding-0 "PY=uv run --locked"

      - name: Encoding regressions with UTF-8 enabled
        if: *test_ready
        env:
          PYTEST_ADDOPTS: --junitxml=.test-results/encoding-1.xml --basetemp=.test-results/tmp-encoding-1 --durations=25
        run: make test-encoding-1 "PY=uv run --locked"

      - name: Slow regressions
        timeout-minutes: 5
        if: *test_ready
        env:
          COVERAGE_FILE: .test-results/.coverage.slow
          PYTEST_ADDOPTS: --junitxml=.test-results/slow.xml --basetemp=.test-results/tmp-slow --durations=25 --cov --cov-report= --cov-fail-under=0
        run: make test-slow

      - name: Integration regressions
        # Real parent/child startup includes cold imports under coverage on
        # shared runners. Individual tests still enforce shutdown deadlines.
        timeout-minutes: 10
        if: *test_ready
        env:
          COVERAGE_FILE: .test-results/.coverage.integration
          PYTEST_ADDOPTS: --junitxml=.test-results/integration.xml --basetemp=.test-results/tmp-integration --durations=25 --cov --cov-report= --cov-fail-under=0
        run: make test-integration

      - name: Combine suite coverage
        if: *test_ready
        run: uv run --locked coverage combine --keep .test-results

      - name: Check combined coverage
        if: *test_ready
        run: uv run --locked coverage report

      - name: Render combined coverage
        if: *test_ready
        run: uv run --locked coverage html

      - name: Upload coverage data
        if: *test_ready
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_attempt }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Collect subprocess logs without following test symlinks
        if: ${{ always() }}
        run: uv run --no-project python scripts/collect_test_logs.py

      - name: Upload test reports and subprocess logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_attempt }}
          path: |
            .test-results/*.xml
            .test-results/subprocess-logs.zip
            htmlcov/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - *checkout
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*-${{ github.run_attempt }}
          path: coverage-data
      # Keep artifact directories separate to avoid overwriting .coverage files.
      - name: Combine all platforms and Python versions
        run: uv run --locked --only-group coverage coverage combine --keep coverage-data/*/.coverage
      - name: Check total coverage
        run: uv run --locked --only-group coverage coverage report
      - name: Render coverage HTML
        run: uv run --locked --only-group coverage coverage html
      - name: Render coverage XML
        run: uv run --locked --only-group coverage coverage xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-combined-${{ github.run_attempt }}
          path: |
            .coverage
            htmlcov/
            coverage.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
