# Shared lint, UI tests and fast Python tests with branch coverage on all three OSes.
# All slow and integration tests run on all three OSes.
# Fresh CLI and Make bootstrap run without manual dependency sync on all three OSes.
# Platform-specific tests declare their requirements with pytest skips.
# Package jobs run the platform installers, doctor and HTTP server checks.
# Real hardware needs manual validation.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-id:
        description: Tested Python release artifacts
        value: ${{ jobs.package.outputs.artifact-id }}
      version:
        description: Tested package version
        value: ${{ jobs.package.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  package:
    uses: ./.github/workflows/package.yml

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # OpenCV's manylinux wheel links libGL + glib; install them so `import
      # cv2` works headless (mirrors install.sh's Linux guidance).
      - name: Install OpenCV system libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      # Pinned by SHA: setup-uv stopped publishing major tags in v8.
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Fresh CLI startup without CAD
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/physiclaw-cli-smoke
        run: uv run --locked pytest -m slow tests/cli/test_fresh_start.py

      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --yes --no-progress
          }

      # Start with no project venv and no manual sync, as a fresh clone would.
      # The Make target must install both dev and CAD dependencies itself.
      - name: Bootstrap and test with coverage
        # Keep native-encoding coverage, especially Windows' legacy code page.
        env:
          PYTHONUTF8: "0"
        run: make test-cov

      # Inline JavaScript uses Node's built-in test runner; no npm
      # packages or Node runtime are needed by the Python application.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.python == '3.12'
        with:
          node-version: "22"
          package-manager-cache: false

      - name: JavaScript UI regressions
        if: matrix.python == '3.12'
        run: make test-studio-ui

      - name: Lint
        if: matrix.python == '3.12'
        run: make lint

      # Mirrors `make typecheck`: scope + settings from [tool.mypy] in
      # pyproject (application and hardware/port; CAD workflows are not gated yet).
      # Mypy defaults to the runner's native sys.platform, including win32.
      - name: Type check
        run: uv run --locked mypy

      # Static cross-artifact consistency for the CAD pipeline (procedure
      # stems / annotations / manual figures / sourcing ids) — stdlib-only, no
      # cad dependency group needed.
      - name: Hardware consistency check
        env:
          PHYSICLAW_HW_OUTPUT: ${{ runner.temp }}/hardware-smoke
        run: uv run --locked python -m hardware check

      - name: Hardware CAD smoke build
        env:
          PHYSICLAW_HW_OUTPUT: ${{ runner.temp }}/hardware-smoke
        run: make hw-build ARGS="--stems fastener_10_BHCS --bom"

      - name: Encoding regressions in both UTF-8 modes
        run: make test-encoding "PY=uv run --locked"

      - name: Slow regressions
        run: make test-slow

      - name: Integration regressions
        run: make test-integration
