name: Package

on:
  workflow_call:
    outputs:
      artifact-id:
        description: Immutable artifact containing the tested wheel, sdist and manifest
        value: ${{ jobs.build.outputs.artifact-id }}
      version:
        description: Package version
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: false
      - name: Check version and lockfile
        id: version
        run: |
          uv lock --check
          uv run --no-project python -c 'from scripts.release import read_version; print("version=" + read_version())' >> "$GITHUB_OUTPUT"
      - name: Build source archive and wheel from that archive
        # uv's default builds the sdist first, then the wheel from the sdist.
        run: >-
          uv build --no-sources --out-dir release-bundle/dist
          --build-constraints scripts/release-build-constraints.txt --require-hashes
      - name: Validate metadata, resources and checksums
        run: |
          uvx --from twine==7.0.0 twine check --strict release-bundle/dist/*
          uv run --no-project python scripts/check_package.py record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: python-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: false
      - name: Install OpenCV system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-bundle
          merge-multiple: true
      - name: Install and smoke-test wheel and source archive in separate clean environments
        run: uv run --no-project python scripts/check_package.py smoke
