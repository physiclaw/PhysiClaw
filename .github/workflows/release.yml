name: Release

on:
  push:
    tags: ['v[0-9]*']
  # Manual runs exercise the entire validation/build pipeline without publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Checkout's tag+SHA fallback replaces annotated tags with commits.
          # Select the immutable commit directly so validation sees the real tag.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: false
      - name: Validate release tag, source commit and lockfile
        if: github.ref_type == 'tag'
        run: uv run --no-project python scripts/release.py validate-tag

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  prepublish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'physiclaw/PhysiClaw'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.ci.outputs.artifact-id }}
          path: release-bundle
          merge-multiple: true
      - name: Reject conflicting or unattested existing files before retrying an upload
        run: uv run --no-project python scripts/check_package.py verify-pypi --allow-missing

  publish:
    needs: [ci, prepublish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/physiclaw/${{ needs.ci.outputs.version }}/
    permissions:
      id-token: write
    # No checkout, dependency installation, or execution of project code here.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.ci.outputs.artifact-id }}
          path: release-bundle
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release-bundle/dist/
          attestations: true
          # The separate prepublish job checks existing bytes AND attestations.
          skip-existing: true

  verify:
    needs: [ci, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: false
      - name: Install OpenCV system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.ci.outputs.artifact-id }}
          path: release-bundle
          merge-multiple: true
      - name: Verify published checksums and Sigstore attestations for both files
        run: uv run --no-project python scripts/check_package.py verify-pypi
      - name: Fresh install from PyPI
        env:
          RELEASE_VERSION: ${{ needs.ci.outputs.version }}
          PHYSICLAW_HOME: ${{ runner.temp }}/physiclaw-release-home
        run: |
          uvx --from "physiclaw==$RELEASE_VERSION" --refresh-package physiclaw physiclaw --version
          uvx --from "physiclaw==$RELEASE_VERSION" physiclaw --help

  github-release:
    needs: [ci, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.ci.outputs.artifact-id }}
          path: release-bundle
          merge-multiple: true
      - name: Create release notes after PyPI verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.ci.outputs.version }}
        run: |
          state="$RUNNER_TEMP/github-release.json"
          if ! gh release view "$RELEASE_TAG" --json isDraft,assets > "$state"; then
            args=(--verify-tag --generate-notes --latest=false --draft)
            if [[ "$RELEASE_VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
              args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${args[@]}"
            gh release view "$RELEASE_TAG" --json isDraft,assets > "$state"
          fi

          # Resume partial uploads only in drafts. Never overwrite existing bytes.
          existing=$(mktemp -d)
          for file in release-bundle/dist/* release-bundle/manifest.json; do
            name=${file##*/}
            if jq -e --arg name "$name" '.assets | any(.name == $name)' "$state" >/dev/null; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$existing"
              cmp "$file" "$existing/$name"
            elif jq -e '.isDraft' "$state" >/dev/null; then
              gh release upload "$RELEASE_TAG" "$file"
            else
              echo "Published GitHub release is missing $name; inspect it before changing it." >&2
              exit 1
            fi
          done
          # Hardware consumers depend on releases/latest; leave it unchanged.
          if jq -e '.isDraft' "$state" >/dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          fi
