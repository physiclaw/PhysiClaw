extend = "../pyproject.toml"
src = ["..", "../src"]
extend-exclude = ["output"]

[lint]
extend-select = ["B", "C4", "ICN", "PIE", "RUF100", "TID252", "UP"]

[lint.per-file-ignores]
# Dynamic OS-only APIs must remain type-checkable from either platform.
"port/backends/*.py" = ["B009"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"
