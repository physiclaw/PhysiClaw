# The pack MANIFEST — what the app is and what its playbooks share:
# placeholders, landmarks, and any pages more than one route lands on.
# Never a route: each playbook is its own folder beside this file
# (buy/PLAYBOOK.yml → taobao/buy), and the hands routes share are pack
# macros (macros/launch.yml is the cold launch every route starts with).
app: taobao
description: >-
  Buy one item on 淘宝 (Taobao) by keyword, deterministically — search →
  pick by criteria → buy sheet → human payment gate → pay. Adopt for
  淘宝 purchases without freeform driving.

placeholders:
  CONTACT:
    description: the IM contact name of YOUR user thread, exactly as the chat app shows it
    example: QiaoQian

landmarks:
  dismiss:
    label: "scrim above a bottom sheet"  # below the IM-banner zone (y < 0.15)
    at: [0.35, 0.16, 0.65, 0.24]         # the `covered:` recover hand taps it
  cart:
    label: "购物车"                       # detail-page bottom bar, third icon —
    at: [0.231, 0.898, 0.346, 0.954]     # measured live on the detail footer
  confirm:
    label: ["确定", "加入购物车"]           # a sheet's full-width bottom button —
    at: [0.06, 0.910, 0.94, 0.955]       # UNRECORDED estimate — record it
  close:
    label: "the ✕ below a promo popup card"  # 天降红包 / coupon popups: an icon,
    at: [0.44, 0.665, 0.56, 0.735]           # no text row — the box is the tap
  select-all:
    label: "全选"                             # the cart footer's left checkbox + label
    at: [0.040, 0.858, 0.220, 0.896]         # the label sits at x 0.14–0.21

# The pages every route lands on, declared once: anchors (semantics —
# geometry is captured on YOUR device via `physiclaw playbooks pages
# calibrate taobao`) and the recover hand each page runs when a walk
# is not where it must be. A route may declare its own hand for a page
# to override these for that walk.
pages:
  home:
    anchors:
      - {text: ["推荐", "关注"], within: top}   # one anchor, two readings
    recover: force_quit           # not this page → force_quit, then walk
                                  # again from the route top (start re-runs);
                                  # what you write is what runs
  results:                        # the filter row pins them: two-char
    anchors:                      # anchors are read exactly, so the band
      - {text: "综合", within: top}   # keeps feed text (组合, 热销) from
      - {text: "销量", within: top}   # standing in for them
    scrollable: true
    recover:                      # one hand per reading of the deviation:
      covered: {tap: landmarks.dismiss}   # a coupon sheet over the results
      elsewhere: go_back                  # a promo page or mis-tap: the edge
                                          # swipe (the chevron tap misses)
    tries: 2                      # this page's tries per walk
  # The sheet's identity is two rows every variant prints: the pay
  # button and the total. Rows that vary between sheets (备注 vs 开具发票,
  # 顺手买 vs 超值换购) are not anchors — every anchor must show.
  buysheet:
    anchors:
      - {text: ["免密支付", "提交订单", "立即支付"], within: bottom}
      - {text: ["实付", "补贴后", "优惠后", "价格明细"], within: [0.0, 0.15, 1.0, 0.85]}  # the total row: below the header banner, above the pay bar
    forbid: ["支付成功"]
    recover:
      covered: {tap: landmarks.close}
      elsewhere: go_back
    tries: 2
  detail:                         # a listing's page: the footer's two buttons
    anchors:
      - {text: "加入购物车", within: bottom}
      - {text: ["立即购买", "领券购买"], within: bottom}
    recover:
      covered: {tap: landmarks.close}
      elsewhere: go_back
    tries: 2
  cart:                           # the 购物车 tab. Not the 结算 button: it reads
    anchors:                      # 结算（1） once a line is ticked, and a two-char
      - {text: "购物车", within: top}     # anchor is read exactly — the title
      - {text: "全选", within: bottom}    # (购物车（85）) and 全选 hold either way
    scrollable: true
    recover:
      covered: {tap: landmarks.close}
    tries: 2
  paid:
    anchors:
      - ["支付成功", "付款成功", "购买成功"]
