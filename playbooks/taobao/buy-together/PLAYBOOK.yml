# taobao/buy-together — several items in ONE order: each into the cart
# (`add`, once per item), then one checkout. Read top to bottom: understand,
# acknowledge, gather each, check out, report.
name: buy-together
description: buy several items on 淘宝 (Taobao) in ONE order by courier — the default for a list of products naming no store
enabled: false  # rehearse on YOUR device, then enable
inputs:
  user_said:
    description: what the user said, verbatim — the original message the task came from

route:
  # The list the whole errand runs on. On a revision (a reply to the
  # confirmation that is neither yes nor no) this same step runs again
  # with the replies and what is already in the cart — the slots below
  # are empty on the first pass.
  - agent: parse
    prompt: |
      The buyer said: "{inputs.user_said}"
      Later replies, if any: {ask.replies}
      The list as it stood before those replies: {parse.items}
      Already in the cart from this errand: {add.line}
      Return the FULL list the buyer wants now, one product per line as
      name + spec + quantity (e.g. 五常大米 5kg ×2); leave out anything
      they no longer want. Keep the buyer's language. Keep every line
      of the earlier list the buyer did not change WORD FOR WORD — that
      line is how the cart knows the item is already in it.
      If the message names no concrete product, return escalate.
    returns:
      items: the full list now, one per line
    think: off

  - tell: ack
    message: "收到，正在淘宝为你挑选：\n{parse.items}"

  - run: add                      # one round per item, from add's own cold start;
    each: {item: parse.items}     # an item already in the cart is not added again
    miss: skip                    # an item that cannot be found is reported, not fatal
    limit: {rounds: 4}

  - page: detail                  # where the last round left the phone

  - run: checkout                 # the cart to one paid order
    with: {lines: "{add.line}"}   # every done round's line; a missed item has none
    revise: parse                 # a reply the words miss re-plans from `parse`
    limit: {revisions: 2}

  - page: paid

  - tell: report
    message: "已下单并完成支付：\n{add.line}"
