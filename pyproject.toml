[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "physiclaw"
version = "0.11.0"
description = "Give AI agents a physical finger to operate any phone — robotic stylus + camera, no APIs needed."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Qiao Qian", email = "qiaoqianda@gmail.com" }]
keywords = ["robotics", "mcp", "llm-agent", "phone-automation", "vision", "stylus", "grbl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = [
    # Stable APIs have a major-version ceiling; pre-1.0 APIs stay on
    # their tested minor line. uv.lock pins the complete development graph.
    "pyserial>=3.5,<4",
    # 4.14 fixes the GaussianBlur race on small images with many threads:
    # https://github.com/opencv/opencv/issues/28370.
    "opencv-python>=4.14,<5",
    "numpy>=1.26,<3",
    # Probe supported image headers before OpenCV can allocate decoded pixels.
    "pillow>=13,<14",
    # Our MCPServer/ToolError APIs require SDK 2. Version 2.2 fixes unbounded
    # StreamableHTTP sessions (GHSA-84m7-p3x7-pcfv).
    "mcp>=2.2,<3",
    # Direct import; [socks] pulls socksio so socks5:// proxies work
    # (physiclaw.common.proxy rewrites Linux VPN clients' socks:// to socks5://).
    "httpx[socks]>=0.28.1,<0.29",
    # The MCP transport receives an httpx2 client; keep it on SDK 2's major.
    "httpx2>=2.12,<3",
    # Security floors for transitive dependencies also protect wheel installs:
    # certifi removes compromised emSign trust roots (GHSA-6q48-6c7w-9gw2);
    # OpenTelemetry bounds tracestate parsing (GHSA-xcq7-p3pf-p88h).
    "certifi>=2026.10.19",
    "opentelemetry-api>=1.45.1,<2",
    "croniter>=6.2.2,<7",
    # RapidOCR 3.10 switched to opencv-python-headless, which shares cv2
    # with our opencv-python dependency. Keep only one OpenCV distribution.
    "rapidocr>=3.7.0,<3.10",
    "onnxruntime>=1.24.0,<2",
    "typer>=0.24.1,<0.25",
    # Per-character prompt styling and command recall on Windows/macOS/Linux.
    "prompt-toolkit>=3.0.52,<4",
    "tomlkit>=0.14,<0.15",
    "anthropic>=0.97,<0.98",
    # MACRO.yml parsing. ruamel over PyYAML for YAML 1.2 semantics: unquoted
    # yes/no/on/off stay strings (macro guards match literal screen text, so
    # 1.1's implicit booleans would silently corrupt them).
    "ruamel-yaml>=0.19.1,<0.20",
    # Imported directly by our CLI and ASGI servers, independent of what
    # Typer or MCP happens to bring in transitively.
    "click>=8.3.1,<9",
    "pydantic>=2.12.5,<3",
    # 1.3.1 includes the form parsing, URL, and Windows StaticFiles fixes.
    "starlette>=1.3.1,<2",
    "uvicorn>=0.42,<0.43",
    # Public drain control keeps MCP SSE alive until the managed client exits.
    "sse-starlette>=3.3.3,<4",
]

[project.urls]
Homepage = "https://github.com/physiclaw/PhysiClaw"
Repository = "https://github.com/physiclaw/PhysiClaw"
Issues = "https://github.com/physiclaw/PhysiClaw/issues"

[dependency-groups]
build = ["hatchling>=1.32.4,<2"]
cad = [
    "build123d==0.13.0",
    "shapely>=2.1.2,<3",
]
dev = [
    # Exercise the real package backend in offline packaging regression tests.
    {include-group = "build"},
    "ruff>=0.15.9",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.23",
    "freezegun>=1.5",
    "hypothesis>=6.100",
    "respx>=0.21",
    "mutmut>=2.5,<3",
    "mypy>=2.3.0",
    "types-pyserial>=3.5.0.20260712",
    "types-croniter>=6.2.4.20260711",
]

[tool.uv.dependency-groups]
cad = {requires-python = ">=3.12,<3.15"}

[tool.hatch.build.targets.sdist]
# Do not descend into ignored test trees, caches, or generated hardware outputs.
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["src/physiclaw"]

[project.scripts]
physiclaw = "physiclaw.cli:app"

[tool.ruff]
# Exclude generated hardware diagnostic scripts from source checks.
extend-exclude = ["hardware/output"]
force-exclude = true
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I",  # Python style, undefined names and import ordering.
    "UP", "B", "SIM", "C4", "PIE",  # Modern syntax and common mistakes.
    "ICN", "TID252", "RUF100",  # Import conventions and valid suppressions.
    "ASYNC", "PT",  # Async correctness and pytest checks.
]
ignore = [
    # Ruff's formatter owns indentation and wrapping, including long templates.
    "E111", "E114", "E117", "E501", "W191",
    # Keep established parameter-name, composite-assert and fixture-name styles.
    "PT006", "PT018", "PT019",
    # suppress() also filters ExceptionGroups; retain try/except boundaries.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# Pytest rules apply to the test suite, not similarly named application methods.
"!tests/**.py" = ["PT"]
# Nested fixture lifetimes are intentional; temporary fixture I/O is synchronous.
"tests/**.py" = ["SIM117", "ASYNC240"]
# This test's timeout argument is input data for the lifecycle API under test.
"tests/cli/test_runtime_process.py" = ["ASYNC109"]
# Native APIs use dynamic lookup so both platforms can type-check these files.
"src/physiclaw/port/backends/**.py" = ["B009"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    # These frozen dataclasses contain only immutable strings and integers.
    "physiclaw.contract.plugin.TurnProducer",
    "physiclaw.agent.llm.context_policy.CollapsePolicy",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
# Baseline gate: mypy defaults plus untyped-def bodies and ignore hygiene.
# Ratchet toward strict per-module (disallow_untyped_defs and friends) as
# annotations fill in, rather than blanket-strict on a retrofit codebase.
files = ["src/physiclaw", "hardware/port"]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
extra_checks = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
# Ship no py.typed marker or stubs.
module = ["rapidocr.*", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The first packages ratcheted to strict defs: every function is fully
# annotated, so a driver's hooks (`conductor.drive.hooks`) and the walk's
# states are checked, not trusted.
module = ["physiclaw.conductor.*", "physiclaw.debug.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
# "." makes the repo-root `hardware` package importable for tests/hardware
# (it ships in GitHub releases, not the wheel, so it can't live in src/).
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "slow: tests that take >100ms each — excluded from default fast run",
    "integration: tests that require real hardware or external services — excluded from default fast run",
]
addopts = "-ra --strict-markers -m 'not slow and not integration'"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/physiclaw"]
omit = [
    "src/physiclaw/agent/runtime/__main__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "pragma: no cover",
]
